name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The repository must have Pages enabled once with source "GitHub Actions".
      # configure-pages@v5 cannot do that with the default GITHUB_TOKEN; its enablement
      # input requires a separate PAT/App token with administration:write + pages:write.
      - uses: actions/configure-pages@v6
      # v5+ of the pages actions run on node24 and use the current artifact API; the v3/v4 pair
      # started failing with "No artifacts named github-pages were found" on every deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # dist/.nojekyll is a dotfile; Pages must ship it or the underscore-prefixed assets 404.
          include-hidden-files: true
      # deploy-pages looks the artifact up the moment it starts, and the artifact API sometimes lags
      # behind a green upload — the deploy then dies with "No artifacts named github-pages were found"
      # even though the artifact is listed a minute later (run 46056408499 is exactly that). A blind
      # sleep is not reliable, so wait until the API actually lists it, and fail loudly if it never does.
      - name: Wait for the github-pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 36); do
            count=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "github-pages artifact is visible (attempt $attempt, ~$((attempt * 5))s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The github-pages artifact never became visible to the API in 3 minutes."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
