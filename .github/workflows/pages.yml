name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The repository must have Pages enabled once with source "GitHub Actions".
      # configure-pages@v5 cannot do that with the default GITHUB_TOKEN; its enablement
      # input requires a separate PAT/App token with administration:write + pages:write.
      - uses: actions/configure-pages@v6
      # v5+ of the pages actions run on node24 and use the current artifact API; the v3/v4 pair
      # started failing with "No artifacts named github-pages were found" on every deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # dist/.nojekyll is a dotfile; Pages must ship it or the underscore-prefixed assets 404.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
